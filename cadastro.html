
<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Cadastro</title>

</head>

<body>

    <header>
        <a href="index.html">
            <img src="imagens/logo.png" alt="Logo Guia Bre" id="logo">
        </a>

        <div class="barra-pesquisa">
            <input type="search" placeholder="Pesquisar">
            <button type="button">Buscar</button>
        </div>

        <input type="checkbox" id="menu-toggle" class="menu-toggle">

        <label for="menu-toggle" class="menu-hamburguer">
            <span></span>
            <span></span>
            <span></span>
        </label>

        <nav class="links">
            <a href="index.html"> <b>Inicio</b> </a> 
            <a href="loja.html"> <b>Loja</b> </a>
            <a href="cadastro.html"> <b>Cadastre-se</b> </a>
            <a href="login.html"> <b>Login</b> </a>
            <a href="perfil.html"> <b>Perfil</b> </a>
        </nav>
    </header>

    <main class="pagina-cadastro">

        <section class="formulario-cadastro">

            <h1>Crie sua conta</h1>

            <div class="descricao-cadastro">
                Faça o seu cadastro abaixo
            </div>

            <form action="#" method="post">

                <div class="campo">
                    <label for="nome">Nome completo</label>
                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome completo"
                        autocomplete="name"
                        minlength="3"
                        required>
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="exemplo@email.com"
                        autocomplete="email"
                        required>
                </div>

                <div class="campo">
                    <label for="cpf">CPF</label>
                    <input
                        type="text"
                        id="cpf"
                        name="cpf"
                        placeholder="000.000.000-00"
                        autocomplete="off"
                        inputmode="numeric"
                        pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
                        title="Digite o CPF no formato 000.000.000-00"
                        required>
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Crie uma senha"
                        autocomplete="new-password"
                        minlength="8"
                        required>
                </div>

                <div class="campo">
                    <label for="confirmar-senha">Confirmar senha</label>
                    <input
                        type="password"
                        id="confirmar-senha"
                        name="confirmar-senha"
                        placeholder="Digite a senha novamente"
                        autocomplete="new-password"
                        minlength="8"
                        required>
                </div>

                <button type="submit">Cadastrar</button>

            </form>

            <div class="voltar-inicio">
                Já tem uma conta?
                <a href="index.html">Voltar ao início</a>
            </div>

        </section>
    </main>
    <footer>
            <div class="redes-sociais">
                <h2>Redes sociais</h2>

                <a href="https://www.instagram.com/guia.bre/" target="_blank">
                <img src="imagens/instagram.png" alt="Instagram">
                </a>

                <a href="https://api.whatsapp.com/send/?phone=5548996383214&text&type=phone_number&app_absent=0" target="_blank">
                <img src="imagens/whatsapp.png" alt="WhatsApp">
                </a>
            </div>

            <div class="formulario-contato">
                <h2>Entre em contato</h2>

                <form action="#" method="post">
                    <label for="nome-contato">Nome</label>
                    <input type="text" id="nome-contato" name="nome" placeholder="Seu nome" required>

                    <label for="email-contato">E-mail</label>
                    <input type="email" id="email-contato" name="email"
                   placeholder="Seu e-mail" required>

                    <label for="mensagem">Mensagem</label>
                    <textarea id="mensagem" name="mensagem"
                      placeholder="Escreva sua mensagem"
                      rows="4" required></textarea>

                    <button type="submit">Enviar mensagem</button>
                </form>
            </div>

        </footer>

</body>


</html>
