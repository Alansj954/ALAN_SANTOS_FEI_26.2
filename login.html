
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Guia Bre</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <a href="index.html">
            <img src="imagens/logo.png" alt="Logo Guia Bre" id="logo">
        </a>
           
        <div class="barra-pesquisa">
            <input type="search" placeholder="Pesquisar">
            <button type="button">Buscar</button>
        </div>

        <nav class="links">
            <a href="index.html"> <b>Inicio</b> </a>
            <a href="loja.html"> <b>Loja</b> </a> 
            <a href="cadastro.html"> <b>Cadastre-se</b> </a>
            <a href="login.html"> <b>Login</b> </a>
            <a href="perfil.html"> <b>Perfil</b> </a>
            >
        </nav>
    </header>

    <main class="pagina-login">

        <section class="formulario-login">

            <h1>Bem-vindo de volta!</h1>

            <form action="#" method="post">

                <div class="campo-login">
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        autocomplete="email"
                        required>
                </div>

                <div class="campo-login">
                    <label for="senha">Senha</label>
                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        required>
                </div>

                <button type="submit">Entrar</button>

            </form>

            <div class="link-cadastro">
                Ainda não tem uma conta?
                <a href="cadastro.html">Cadastre-se</a>
            </div>

        </section>

    </main>

    <footer>
            <div class="redes-sociais">
                <h2>Redes sociais</h2>

                <a href="https://www.instagram.com/guia.bre/" target="_blank">
                <img src="imagens/instagram.png" alt="Instagram">
                </a>

                <a href="https://api.whatsapp.com/send/?phone=5548996383214&text&type=phone_number&app_absent=0" target="_blank">
                <img src="imagens/whatsapp.png" alt="WhatsApp">
                </a>
            </div>

            <div class="formulario-contato">
                <h2>Entre em contato</h2>

                <form action="#" method="post">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" placeholder="Seu nome" required>

                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email"
                   placeholder="Seu e-mail" required>

                    <label for="mensagem">Mensagem</label>
                    <textarea id="mensagem" name="mensagem"
                      placeholder="Escreva sua mensagem"
                      rows="4" required></textarea>

                    <button type="submit">Enviar mensagem</button>
                </form>
            </div>

        </footer>

</body>

</html>
